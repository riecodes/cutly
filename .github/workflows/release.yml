name: Release

# Tag `vX.Y.Z` on main and a signed APK lands on the GitHub release page.
#
# Secrets: KEYSTORE_BASE64 (the upload keystore, base64), KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD. Generate the keystore once and never lose it; sideload updates only install over a
# build signed with the same key.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count, which a shallow clone would report as 1.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Test and build signed release
        env:
          CUTLY_VERSION: ${{ github.ref_name }}
          CUTLY_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          CUTLY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CUTLY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CUTLY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export CUTLY_VERSION="${CUTLY_VERSION#v}"
          ./gradlew testDebugUnitTest assembleRelease bundleRelease --no-daemon

      # The APK is what the install page links to. The AAB is the Play Console upload; it is
      # signed with the same key, which becomes the Play App Signing upload key.
      - name: Name and checksum the artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "cutly-$version.apk"
          cp app/build/outputs/bundle/release/app-release.aab "cutly-$version.aab"
          sha256sum "cutly-$version.apk" "cutly-$version.aab" > "cutly-$version.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cutly-*.apk
            cutly-*.aab
            cutly-*.sha256
          generate_release_notes: true
