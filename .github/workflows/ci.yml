name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Fork pull requests run here too, so the token gets read access and nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug build
        # Dependency verification (gradle/verification-metadata.xml) is skipped when the
        # configuration cache is on, so CI turns it off. A fresh runner gains nothing from it.
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --no-configuration-cache

      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
